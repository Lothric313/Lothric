<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" preserveAspectRatio="none" fill="none">
  <!-- Decorative canvas grain, worn pigment and sparse craquelure. No text. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".48" numOctaves="3" seed="21" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    </filter>
    <pattern id="weave" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0H5M0 0V5" stroke="#79674b" stroke-opacity=".055" stroke-width=".55"/>
    </pattern>
    <radialGradient id="patina">
      <stop stop-color="#806444" stop-opacity=".10"/><stop offset=".65" stop-color="#a1845b" stop-opacity=".035"/><stop offset="1" stop-color="#a1845b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chalk">
      <stop stop-color="#fff8e8" stop-opacity=".38"/><stop offset="1" stop-color="#fff8e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="800" fill="url(#weave)"/>
  <rect width="1000" height="800" filter="url(#grain)"/>
  <ellipse cx="94" cy="154" rx="290" ry="245" fill="url(#patina)"/>
  <ellipse cx="920" cy="628" rx="240" ry="270" fill="url(#patina)"/>
  <ellipse cx="641" cy="156" rx="252" ry="165" fill="url(#chalk)"/>
  <ellipse cx="281" cy="647" rx="310" ry="169" fill="url(#chalk)"/>
